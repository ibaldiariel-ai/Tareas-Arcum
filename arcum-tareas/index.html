<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ARCUM Tareas</title>
<meta name="theme-color" content="#F5821F" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">
  <!-- Header -->
  <div class="app-header">
    <div class="brand">
      <img src="logo-shield.png" alt="ARCUM" />
      <span class="brand-name"><span class="orange">ARCUM</span><span class="blue"> tareas</span></span>
    </div>
    <button class="icon-btn" id="btn-whoami" title="Cambiar usuario"><i class="ti ti-user-circle"></i></button>
  </div>

  <!-- HOME VIEW -->
  <div id="view-home">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num orange" id="stat-pending">0</div><div class="stat-label">pendientes</div></div>
      <div class="stat-card"><div class="stat-num danger" id="stat-overdue">0</div><div class="stat-label">vencidas</div></div>
      <div class="stat-card"><div class="stat-num blue" id="stat-today">0</div><div class="stat-label">hechas hoy</div></div>
    </div>

    <div class="filter-row" id="filter-row">
      <div class="filter-chip active-all" data-filter="all">todos</div>
      <div class="filter-chip" data-filter="ariel">Ariel</div>
      <div class="filter-chip" data-filter="vale">Vale</div>
    </div>

    <div class="months-strip" id="months-strip"></div>

    <div id="task-list"></div>
  </div>

  <!-- INDICATORS VIEW -->
  <div id="view-indicators" style="display:none;">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num blue" id="week-done">0</div><div class="stat-label">completadas</div></div>
      <div class="stat-card"><div class="stat-num orange" id="week-pending">0</div><div class="stat-label">pendientes</div></div>
    </div>
    <div class="card">
      <div class="card-title">por persona (últimos 7 días)</div>
      <div class="week-bar-row">
        <span class="name">Ariel</span>
        <div class="week-bar-track"><div class="week-bar-fill" id="bar-ariel" style="width:0%; background:var(--arcum-orange);"></div></div>
        <span class="count" id="count-ariel">0</span>
      </div>
      <div class="week-bar-row">
        <span class="name">Vale</span>
        <div class="week-bar-track"><div class="week-bar-fill" id="bar-vale" style="width:0%; background:var(--arcum-blue);"></div></div>
        <span class="count" id="count-vale">0</span>
      </div>
    </div>
    <div class="card">
      <div class="card-title">últimas observaciones</div>
      <div id="obs-list"><div class="empty-state">Todavía no hay observaciones.</div></div>
    </div>
  </div>
</div>

<!-- FAB -->
<button class="fab" id="fab-add"><i class="ti ti-plus"></i></button>

<!-- Bottom nav -->
<div class="bottom-nav">
  <div class="bottom-nav-inner">
    <button class="nav-btn active" data-view="home"><i class="ti ti-home"></i>inicio</button>
    <button class="nav-btn" data-view="indicators"><i class="ti ti-chart-bar"></i>resumen</button>
  </div>
</div>

<!-- New task sheet -->
<div class="sheet-overlay" id="sheet-new" style="display:none;">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <span>Nueva tarea</span>
      <button class="icon-btn" id="btn-close-sheet"><i class="ti ti-x"></i></button>
    </div>

    <label class="field-label">Qué hay que hacer</label>
    <input type="text" id="input-title" placeholder="ej: Renovar seguro de la camioneta" />
    <div id="err-title" class="error-text" style="display:none;">Escribí una tarea antes de guardar.</div>

    <label class="field-label">Quién carga</label>
    <div class="toggle-row" id="toggle-assignee">
      <div class="toggle-opt" data-val="ariel">Ariel</div>
      <div class="toggle-opt" data-val="vale">Vale</div>
    </div>

    <label class="field-label">Prioridad</label>
    <div class="toggle-row" id="toggle-priority">
      <div class="toggle-opt sel-orange" data-val="normal">Normal</div>
      <div class="toggle-opt" data-val="urgent">Urgente</div>
    </div>

    <label class="field-label">Fecha estimada de cumplimiento (opcional)</label>
    <input type="date" id="input-due" />

    <button class="btn-primary-lg" id="btn-save-task">Guardar tarea</button>
  </div>
</div>

<!-- Onboarding: who are you -->
<div class="onboard-overlay" id="onboard" style="display:none;">
  <img src="logo-shield.png" alt="ARCUM" />
  <h1>ARCUM tareas</h1>
  <p>¿Quién sos vos?</p>
  <div class="onboard-btns">
    <button class="onboard-btn ariel" data-who="ariel">Ariel</button>
    <button class="onboard-btn vale" data-who="vale">Vale</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
